openapi: 3.0.3
info:
  title: GeeLark API
  description: |
    GeeLark 提供云手机和浏览器自动化 API，用于社交媒体管理。

    ## API 概览
    - **云手机 API**: 控制云手机，管理代理、分组、标签、素材，以及自动化任务
    - **浏览器 API**: 管理具有指纹伪装功能的浏览器环境，用于网页自动化
    - **计费 API**: 管理订阅套餐和计费

    ## 认证方式
    - Token 认证: `Authorization: Bearer <token>`
    - Key 认证: `appId`, `traceId`, `ts`, `nonce`, `sign`

    ## 请求限流
    - 每分钟 200 次请求
    - 每小时 24,000 次请求

    ## 响应格式
    ```json
    {
      "traceId": "string",
      "code": 0,
      "msg": "success",
      "data": {}
    }
    ```
  version: "1.0"
  contact:
    name: GeeLark 支持
    url: https://www.geelark.com

servers:
  - url: https://openapi.geelark.cn/open/v1
    description: 云手机 API 服务器
  - url: http://localhost:40185/api/v1
    description: 浏览器 API（需要本地客户端）

tags:
  - name: 云手机管理
    description: 云手机生命周期管理（创建、启动、停止、删除、克隆）
  - name: 云手机设置
    description: 配置 GPS、网络、截图、ADB 等
  - name: 应用管理
    description: 安装、卸载、启动、停止应用
  - name: 文件管理
    description: 上传文件到云手机和 Keybox 管理
  - name: 素材中心
    description: 管理图片、视频和标签的素材库
  - name: 自动化任务
    description: 社交媒体自动化任务（TikTok、Facebook、Instagram 等）
  - name: 任务管理
    description: 查询、取消、重试自动化任务
  - name: 浏览器管理
    description: 具有指纹伪装的浏览器环境管理
  - name: 分组管理
    description: 将云手机和浏览器组织成分组
  - name: 标签管理
    description: 为云手机和浏览器添加标签进行分类
  - name: 代理管理
    description: 管理代理配置
  - name: 计费
    description: 订阅套餐和计费操作
  - name: Webhook
    description: 任务回调的 Webhook 配置
  - name: 数据分析
    description: 账号数据分析管理

paths:
  # ==================== 云手机管理 ====================
  /phone/list:
    post:
      tags: [云手机管理]
      summary: 获取所有云手机
      description: 获取云手机列表，支持筛选和分页
      operationId: getAllCloudPhones
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloudPhoneListRequest'
            example:
              page: 1
              pageSize: 10
              openStatus: 1
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudPhoneListResponse'

  /phone/addNew:
    post:
      tags: [云手机管理]
      summary: 创建云手机
      description: |
        创建一台或多台云手机。
        - 基础套餐：每次支持创建 1 台云手机
        - 专业套餐：支持批量创建（最多 100 台）
      operationId: createCloudPhones
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCloudPhoneRequest'
            example:
              mobileType: "Android 12"
              chargeMode: 0
              data:
                - profileName: "myPhone"
                  proxyInformation: "socks5://user:pass@100.200.200.100:30000"
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCloudPhoneResponse'

  /phone/start:
    post:
      tags: [云手机管理]
      summary: 启动云手机
      description: 批量启动云手机并返回远程访问链接
      operationId: startCloudPhones
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartCloudPhoneRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartCloudPhoneResponse'

  /phone/stop:
    post:
      tags: [云手机管理]
      summary: 停止云手机
      description: 批量停止运行中的云手机
      operationId: stopCloudPhones
      requestBody:
required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StopCloudPhoneRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchOperationResponse'

  /phone/delete:
    post:
      tags: [云手机管理]
      summary: 删除云手机
      description: 根据 ID 删除云手机
      operationId: deleteCloudPhones
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteCloudPhoneRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchOperationResponse'

  /phone/clone:
    post:
      tags: [云手机管理]
      summary: 克隆云手机
      description: 克隆现有云手机配置
      operationId: cloneCloudPhone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloneCloudPhoneRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloneCloudPhoneResponse'

  /phone/status:
    post:
      tags: [云手机管理]
      summary: 查询云手机状态
      description: 获取云手机当前状态
      operationId: queryCloudPhoneStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - ids
              properties:
                ids:
                  type: array
                  items:
                    type: string
                  description: 云手机 ID 列表
                  maxItems: 200
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryStatusResponse'

  /phone/screenshot:
    post:
      tags: [云手机设置]
      summary: 截图
      description: 截取云手机屏幕
      operationId: takeScreenshot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
              properties:
                id:
                  type: string
                  description: 云手机 ID
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScreenshotResponse'

  /phone/screenshot/result:
    post:
      tags: [云手机设置]
      summary: 获取截图结果
      description: 截取完成后获取截图图片链接
      operationId: getScreenshotResult
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
              properties:
                id:
                  type: string
                  description: 云手机 ID
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScreenshotResultResponse'

  /phone/gps/set:
    post:
      tags: [云手机设置]
      summary: 设置 GPS 位置
      description: 修改云手机的 GPS 位置
      operationId: setGps
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetGpsRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /phone/gps/get:
    post:
      tags: [云手机设置]
      summary: 获取 GPS 位置
      description: 获取云手机当前 GPS 位置
      operationId: getGps
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
              properties:
                id:
                  type: string
                  description: 云手机 ID
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetGpsResponse'

  /phone/network:
    post:
      tags: [云手机设置]
      summary: 修改网络设置
      description: 配置代理和网络设置
      operationId: modifyNetworkSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModifyNetworkRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /phone/network/get:
    post:
      tags: [云手机设置]
      summary: 获取网络设置
      description: 获取当前网络配置
      operationId: getNetworkSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
              properties:
                id:
                  type: string
                  description: 云手机 ID
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetNetworkResponse'

  /phone/netType/set:
    post:
      tags: [云手机设置]
      summary: 设置网络类型
      description: 切换 Wi-Fi 和移动网络
      operationId: setNetType
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetNetTypeRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /phone/root/set:
    post:
      tags: [云手机设置]
      summary: 设置 Root 状态
      description: 开启或关闭 Root 权限
      operationId: setRootStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetRootStatusRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /phone/accessibility/hide:
    post:
      tags: [云手机设置]
      summary: 隐藏无障碍
      description: 隐藏无障碍服务指示器
      operationId: hideAccessibility
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
              properties:
                id:
                  type: string
                  description: 云手机 ID
                hide:
                  type: integer
                  enum: [0, 1]
                  description: 0=显示, 1=隐藏
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /phone/deviceId/get:
    post:
      tags: [云手机设置]
      summary: 获取设备 ID
      description: 获取设备标识信息
      operationId: getDeviceId
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
              properties:
                id:
                  type: string
                  description: 云手机 ID
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceIdResponse'

  /phone/brand/list:
    post:
      tags: [云手机管理]
      summary: 获取云手机品牌列表
      description: 获取可用的云手机品牌型号
      operationId: listCloudPhoneBrands
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                mobileType:
                  type: string
                  description: Android 版本筛选（如 "Android 12"）
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandListResponse'

  /phone/group/move:
    post:
      tags: [云手机管理]
      summary: 移动云手机到分组
      description: 将云手机转移到其他分组
      operationId: moveCloudPhoneToGroup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveToGroupRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /phone/transfer:
    post:
      tags: [云手机管理]
      summary: 转让云手机
      description: 将云手机所有权转让给其他用户
      operationId: transferCloudPhone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferCloudPhoneRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  # ==================== ADB ====================
  /phone/adb/status/set:
    post:
      tags: [云手机设置]
      summary: 设置 ADB 状态
      description: 开启或关闭 ADB 调试
      operationId: setAdbStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetAdbStatusRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /phone/adb/info:
    post:
      tags: [云手机设置]
      summary: 获取 ADB 信息
      description: 获取 ADB 连接详情
      operationId: getAdbInfo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
              properties:
                id:
                  type: string
                  description: 云手机 ID
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdbInfoResponse'

  /phone/shell/execute:
    post:
      tags: [云手机设置]
      summary: 执行 Shell 命令
      description: 在云手机上执行 Shell 命令
      operationId: executeShellCommand
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecuteShellRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecuteShellResponse'

  # ==================== 应用管理 ====================
  /phone/app/list:
    post:
      tags: [应用管理]
      summary: 获取已安装应用
      description: 列出云手机上所有已安装的应用
      operationId: getInstalledApps
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
              properties:
                id:
                  type: string
                  description: 云手机 ID
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppListResponse'

  /phone/app/start:
    post:
      tags: [应用管理]
      summary: 启动应用
      description: 在云手机上启动应用
      operationId: startApp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppOperationRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /phone/app/stop:
    post:
      tags: [应用管理]
      summary: 停止应用
      description: 强制停止应用
      operationId: stopApp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppOperationRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /phone/app/install:
    post:
      tags: [应用管理]
      summary: 安装应用
      description: 从上传的 APK 或 Google Play 安装应用
      operationId: installApp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstallAppRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /phone/app/uninstall:
    post:
      tags: [应用管理]
      summary: 卸载应用
      description: 从云手机移除应用
      operationId: uninstallApp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UninstallAppRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  # ==================== 文件管理 ====================
  /phone/file/upload:
    post:
      tags: [文件管理]
      summary: 上传文件到云手机
      description: 上传文件（图片、视频、文档）到云手机
      operationId: uploadFilesToPhone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadFileRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadFileResponse'

  /phone/file/uploadStatus:
    post:
      tags: [文件管理]
      summary: 查询上传状态
      description: 查看文件上传进度
      operationId: queryUploadStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - taskId
              properties:
                taskId:
                  type: string
                  description: 上传任务 ID
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadStatusResponse'

  /phone/keybox/upload:
    post:
      tags: [文件管理]
      summary: 上传 Keybox 文件
      description: 上传 Keybox（账号）文件用于多账号管理
      operationId: uploadKeyboxFile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadKeyboxRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /material/temp/upload:
    post:
      tags: [素材中心]
      summary: 上传临时文件
      description: 上传文件到 GeeLark 素材中心
      operationId: uploadTempFiles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadMaterialRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadMaterialResponse'

  # ==================== 素材中心 ====================
  /material/search:
    post:
      tags: [素材中心]
      summary: 搜索素材
      description: 从素材中心搜索素材（图片、视频）
      operationId: searchMaterials
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchMaterialRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchMaterialResponse'

  /material/create:
    post:
      tags: [素材中心]
      summary: 创建素材
      description: 添加素材到素材库
      operationId: createMaterial
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMaterialRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateMaterialResponse'

  /material/delete:
    post:
      tags: [素材中心]
      summary: 删除素材
      description: 从素材库移除素材
      operationId: deleteMaterial
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - ids
              properties:
                ids:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /material/tag/search:
    post:
      tags: [素材中心]
      summary: 搜索素材标签
      description: 搜索素材中心的标签
      operationId: searchMaterialTags
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchTagRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchTagResponse'

  /material/tag/create:
    post:
      tags: [素材中心]
      summary: 创建素材标签
      description: 在素材中心创建新标签
      operationId: createMaterialTag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTagRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateTagResponse'

  /material/tag/delete:
    post:
      tags: [素材中心]
      summary: 删除素材标签
      description: 从素材中心删除标签
      operationId: deleteMaterialTag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - ids
              properties:
                ids:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /material/tag/set:
    post:
