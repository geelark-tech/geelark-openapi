      summary: 删除浏览器
      description: 删除浏览器环境
      operationId: deleteBrowser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
              properties:
                id:
                  type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /browser/clone:
    post:
      tags: [浏览器管理]
      summary: 克隆浏览器
      description: 克隆现有浏览器环境
      operationId: cloneBrowser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloneBrowserRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloneBrowserResponse'

  /browser/status:
    post:
      tags: [浏览器管理]
      summary: 检查浏览器状态
      description: 获取浏览器运行状态
      operationId: checkBrowserStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
              properties:
                id:
                  type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrowserStatusResponse'

  /browser/transfer:
    post:
      tags: [浏览器管理]
      summary: 转让浏览器
      description: 将浏览器转移到其他分组
      operationId: transferBrowsers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferBrowsersRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /browser/kernel/download:
    post:
      tags: [浏览器管理]
      summary: 下载并更新内核
      description: 下载或更新浏览器内核
      operationId: downloadKernel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                version:
                  type: string
                  description: 内核版本（不指定则使用最新版本）
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /browser/kernel/query:
    post:
      tags: [浏览器管理]
      summary: 查询内核
      description: 获取可用的浏览器内核版本
      operationId: queryKernel
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KernelQueryResponse'

# ==================== 组件 ====================
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 从 GeeLark 客户端获取的 API Token
    ApiKeyAuth:
      type: apiKey
      in: header
      name: appId
      description: 团队 AppId 用于签名认证

  schemas:
    # ==================== 通用 ====================
    ApiResponse:
      type: object
      properties:
        traceId:
          type: string
          description: 请求追踪 ID
        code:
          type: integer
          description: 响应码（0=成功）
        msg:
          type: string
          description: 响应消息

    BatchOperationResponse:
      type: object
      properties:
        traceId:
          type: string
        code:
          type: integer
        msg:
          type: string
        data:
          type: object
          properties:
            totalAmount:
              type: integer
              description: 总数
            successAmount:
              type: integer
              description: 成功数
            failAmount:
              type: integer
              description: 失败数
            successDetails:
              type: array
              items:
                type: object
            failDetails:
              type: array
              items:
                $ref: '#/components/schemas/FailDetail'

    FailDetail:
      type: object
      properties:
        code:
          type: integer
          description: 错误码
        id:
          type: string
          description: 资源 ID
        msg:
          type: string
          description: 错误消息

    TaskResponse:
      type: object
      properties:
        traceId:
          type: string
        code:
          type: integer
        msg:
          type: string
        data:
          type: object
          properties:
            taskId:
              type: string
              description: 任务 ID

    PaginationRequest:
      type: object
      properties:
        page:
          type: integer
          minimum: 1
          default: 1
          description: 页码
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
          description: 每页条数

    PaginationResponse:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
        list:
          type: array
          items:
            type: object

    # ==================== 云手机 ====================
    CloudPhoneListRequest:
      allOf:
        - $ref: '#/components/schemas/PaginationRequest'
        - type: object
          properties:
            ids:
              type: array
              items:
                type: string
              description: 按云手机 ID 筛选
            serialName:
              type: string
              description: 按名称筛选
            groupName:
              type: string
              description: 按分组名筛选
            tags:
              type: array
              items:
                type: string
              description: 按标签名筛选
            openStatus:
              type: integer
              enum: [0, 1]
              description: 0=关闭, 1=开启

    CloudPhoneListResponse:
      type: object
      properties:
        traceId:
          type: string
        code:
          type: integer
        msg:
          type: string
        data:
          type: object
          properties:
            total:
              type: integer
            page:
              type: integer
            pageSize:
              type: integer
            items:
              type: array
              items:
                $ref: '#/components/schemas/CloudPhone'

    CloudPhone:
      type: object
      properties:
        id:
          type: string
        serialName:
          type: string
        serialNo:
          type: string
        status:
          type: integer
          enum: [0, 1, 2]
          description: 0=已停止, 1=启动中, 2=运行中
        chargeMode:
          type: integer
          enum: [0, 1]
          description: 0=按分钟计费, 1=月租
        group:
          $ref: '#/components/schemas/Group'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        equipmentInfo:
          $ref: '#/components/schemas/EquipmentInfo'
        proxy:
          $ref: '#/components/schemas/Proxy'

    Group:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        remark:
          type: string

    Tag:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        color:
          type: integer
          enum: [0, 1, 2, 3, 4, 5]
          description: 0=白, 1=红, 2=蓝, 3=绿, 4=黄, 5=紫

    EquipmentInfo:
      type: object
      properties:
        countryName:
          type: string
        phoneNumber:
          type: string
        enableSim:
          type: integer
          enum: [0, 1]
        imei:
          type: string
        osVersion:
          type: string
        wifiBssid:
          type: string
        mac:
          type: string
        bluetoothMac:
          type: string
        timeZone:
          type: string
        deviceBrand:
          type: string
        deviceModel:
          type: string
        netType:
          type: integer
          enum: [0, 1]
          description: 0=Wi-Fi, 1=移动网络

    Proxy:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [socks5, http, https]
        server:
          type: string
        port:
          type: integer
        username:
          type: string
        password:
          type: string

    CreateCloudPhoneRequest:
      type: object
      required:
        - mobileType
        - data
      properties:
        mobileType:
          type: string
          enum: [Android 9, Android 10, Android 11, Android 12, Android 13, Android 14, Android 15, Android 16]
        chargeMode:
          type: integer
          enum: [0, 1]
          default: 0
          description: 0=按分钟计费, 1=月租
        region:
          type: string
          enum: [cn, sgp, us]
          description: 数据中心位置
        data:
          type: array
          items:
            $ref: '#/components/schemas/EnvRowApi'
          maxItems: 100

    EnvRowApi:
      type: object
      required:
        - profileName
      properties:
        profileName:
          type: string
        proxyInformation:
          type: string
          description: 代理 URL（socks5://, http://, https://）
        proxyQueryChannel:
          type: integer
          enum: [1, 2]
          default: 2
        dynamicProxy:
          type: string
          description: 动态代理服务商名称
        dynamicProxyLocation:
          type: string
        mobileRegion:
          type: string
        mobileLanguage:
          type: string
        profileGroup:
          type: string
        profileTags:
          type: array
          items:
            type: string
        profileNote:
          type: string
        surfaceBrandName:
          type: string
        surfaceModelName:
          type: string
        netType:
          type: integer
          enum: [0, 1]

    CreateCloudPhoneResponse:
      type: object
      properties:
        traceId:
          type: string
        code:
          type: integer
        msg:
          type: string
        data:
          type: object
          properties:
            totalAmount:
              type: integer
            successAmount:
              type: integer
            failAmount:
              type: integer
            details:
              type: array
              items:
                $ref: '#/components/schemas/CreateResultDetail'

    CreateResultDetail:
      type: object
      properties:
        index:
          type: integer
        code:
          type: integer
        msg:
          type: string
        id:
          type: string
        profileName:
          type: string
        envSerialNo:
          type: string
        equipmentInfo:
          $ref: '#/components/schemas/EquipmentInfo'

    StartCloudPhoneRequest:
      type: object
      required:
        - ids
      properties:
        ids:
          type: array
          items:
            type: string
          maxItems: 200
        width:
          type: integer
          minimum: 200
          maximum: 600
          default: 336
        center:
          type: integer
          enum: [0, 1]
          default: 1
        energySavingMode:
          type: integer
          enum: [0, 1]
          default: 0
        materialTagIds:
          type: array
          items:
            type: string

    StartCloudPhoneResponse:
      type: object
      properties:
        traceId:
          type: string
        code:
          type: integer
        msg:
          type: string
        data:
          type: object
          properties:
            totalAmount:
              type: integer
            successAmount:
              type: integer
            failAmount:
              type: integer
            successDetails:
              type: array
              items:
                $ref: '#/components/schemas/StartSuccessDetail'
            failDetails:
              type: array
              items:
                $ref: '#/components/schemas/FailDetail'

    StartSuccessDetail:
      type: object
      properties:
        id:
          type: string
        url:
          type: string
          description: 远程访问链接
        chargingMethod:
          type: string

    StopCloudPhoneRequest:
      type: object
      required:
        - ids
      properties:
        ids:
          type: array
          items:
            type: string
          maxItems: 200

    DeleteCloudPhoneRequest:
      type: object
      required:
        - ids
      properties:
        ids:
          type: array
          items:
            type: string
          maxItems: 200

    CloneCloudPhoneRequest:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          description: 源云手机 ID
        cloneCount:
          type: integer
          minimum: 1
          maximum: 100
          default: 1
        autoStart:
          type: integer
          enum: [0, 1]
          default: 0

    CloneCloudPhoneResponse:
      type: object
      properties:
        traceId:
          type: string
        code:
          type: integer
        msg:
          type: string
        data:
          type: object
          properties:
            totalAmount:
              type: integer
            successAmount:
              type: integer
            failAmount:
              type: integer
            details:
              type: array
              items:
                $ref: '#/components/schemas/CreateResultDetail'

    QueryStatusResponse:
      type: object
      properties:
        traceId:
          type: string
        code:
          type: integer
        msg:
          type: string
        data:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              status:
                type: integer
              url:
                type: string

    ScreenshotResponse:
      type: object
      properties:
        traceId:
          type: string
        code:
          type: integer
        msg:
          type: string
        data:
          type: object
          properties:
            taskId:
              type: string

    ScreenshotResultResponse:
      type: object
      properties:
        traceId:
          type: string
        code:
          type: integer
        msg:
          type: string
        data:
          type: object
          properties:
            id:
              type: string
            screenshotUrl:
              type: string

    SetGpsRequest:
      type: object
      required:
        - id
        - latitude
        - longitude
      properties:
        id:
          type: string
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        accuracy:
          type: number
          default: 10

    ModifyNetworkRequest:
      type: object
      required:
        - id
      properties:
        id:
          type: string
        proxyInformation:
          type: string
        proxyQueryChannel:
          type: integer

    GetNetworkResponse:
      type: object
      properties:
        traceId:
          type: string
        code:
          type: integer
        msg:
          type: string
        data:
          type: object
          properties:
            proxyType:
              type: string
            proxyServer:
              type: string
            proxyPort:
              type: integer

    SetNetTypeRequest:
      type: object
      required:
        - id
        - netType
      properties:
        id:
          type: string
        netType:
          type: integer
          enum: [0, 1]
          description: 0=Wi-Fi, 1=移动网络

    SetRootStatusRequest:
      type: object
      required:
        - id
        - rootStatus
      properties:
        id:
          type: string
        rootStatus:
          type: integer
          enum: [0, 1]

    DeviceIdResponse:
      type: object
      properties:
        traceId:
          type: string
        code:
          type: integer
        msg:
          type: string
        data:
          type: object
          properties:
            imei:
              type: string
            androidId:
              type: string
            mac:
              type: string

    BrandListResponse:
      type: object
      properties:
        traceId:
          type: string
        code:
          type: integer
        msg:
          type: string
        data:
          type: array
          items:
            type: object
            properties:
              brandName:
                type: string
              models:
                type: array
                items:
                  type: string

    MoveToGroupRequest:
      type: object
      required:
        - ids
        - groupId
      properties:
        ids:
          type: array
          items:
            type: string
        groupId:
          type: string

    TransferCloudPhoneRequest:
      type: object
      required:
        - id
        - userId
      properties:
        id:
          type: string
        userId:
          type: string
          description: 目标用户 ID

    # ==================== ADB ====================
    SetAdbStatusRequest:
      type: object
      required:
        - id
        - status
      properties:
        id:
          type: string
        status:
          type: integer
          enum: [0, 1]

    AdbInfoResponse:
      type: object
      properties:
        traceId:
          type: string
        code:
          type: integer
        msg:
          type: string
        data:
          type: object
          properties:
            adbStatus:
              type: integer
            adbAddress:
              type: string
            debugPort:
              type: integer

    ExecuteShellRequest:
      type: object
      required:
        - id
        - command
      properties:
        id:
          type: string
        command:
          type: string

    ExecuteShellResponse:
      type: object
      properties:
        traceId:
          type: string
        code:
          type: integer
        msg:
          type: string
        data:
          type: object
          properties:
            output:
              type: string

    # ==================== 应用 ====================
    AppOperationRequest:
      type: object
      required:
        - id
        - packageName
      properties:
        id:
          type: string
        packageName:
          type: string

    AppListResponse:
      type: object
      properties:
        traceId:
          type: string
        code:
          type: integer
        msg:
          type: string
        data:
          type: array
          items:
            type: object
            properties:
              packageName:
                type: string
              appName:
                type: string
              versionName:
                type: string
              versionCode:
                type: integer

    InstallAppRequest:
      type: object
      required:
        - id
      properties:
        id:
          type: string
        fileId:
          type: string
          description: 素材中心的文件 ID
        packageUrl:
          type: string
          description: Google Play URL 或 APK 下载链接

    UninstallAppRequest:
      type: object
      required:
        - id
        - packageName
      properties:
        id:
          type: string
        packageName:
          type: string

    # ==================== 文件 ====================
    UploadFileRequest:
      type: object
      required:
        - id
        - fileId
      properties:
        id:
          type: string
        fileId:
          type: string
        path:
          type: string
          default: /sdcard/Download

    UploadFileResponse:
      type: object
      properties:
        traceId:
          type: string
        code:
          type: integer
        msg:
          type: string
        data:
          type: object
          properties:
            taskId:
              type: string

    UploadStatusResponse:
      type: object
      properties:
        traceId:
          type: string
        code:
          type: integer
        msg:
          type: string
        data:
          type: object
          properties:
            status:
              type: string
              enum: [pending, uploading, success, failed]
            progress:
              type: integer
              description: 上传进度百分比

    UploadKeyboxRequest:
      type: object
      required:
        - id
        - keyboxId
      properties:
        id:
          type: string
        keyboxId:
          type: string

    UploadMaterialRequest:
      type: object
      required:
        - fileUrl
        - fileType
      properties:
        fileUrl:
          type: string
        fileType:
          type: integer
          enum: [1, 2]
          description: 1=图片, 2=视频
        fileName:
          type: string

    UploadMaterialResponse:
      type: object
      properties:
        traceId:
          type: string
        code:
          type: integer
        msg:
          type: string
        data:
          type: object
          properties:
            fileId:
              type: string

    # ==================== 素材中心 ====================
    SearchMaterialRequest:
      allOf:
        - $ref: '#/components/schemas/PaginationRequest'
        - type: object
          properties:
            fileName:
              type: string
            tagsId:
              type: array
              items:
                type: string
            source:
              type: integer
              enum: [0, 1, 2, 3, 4, 5]
            fileType:
              type: array
              items:
                type: integer
                enum: [1, 2]
            ids:
              type: array
              items:
                type: string

    SearchMaterialResponse:
      type: object
      properties:
        traceId:
          type: string
        code:
          type: integer
        msg:
          type: string
        data:
          type: object
          properties:
            total:
              type: integer
            page:
              type: integer
            pageSize:
              type: integer
            list:
              type: array
              items:
                $ref: '#/components/schemas/MaterialData'

    MaterialData:
      type: object
      properties:
        id:
          type: string
        createdTime:
          type: integer
        fileName:
          type: string
        fileSize:
          type: integer
        fileUrl:
          type: string
        fileType:
          type: integer
          enum: [1, 2]
        width:
          type: integer
        height:
          type: integer
        source:
          type: integer
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        userName:
          type: string

    CreateMaterialRequest:
      type: object
      required:
        - fileId
        - fileName
      properties:
        fileId:
          type: string
        fileName:
          type: string
        tagsId:
          type: array
          items:
            type: string

    CreateMaterialResponse:
      type: object
      properties:
        traceId:
          type: string
        code:
          type: integer
        msg:
          type: string
        data:
          type: object
          properties:
            id:
              type: string

    SearchTagRequest:
      type: object
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        name:
          type: string

    SearchTagResponse:
      type: object
      properties:
        traceId:
          type: string
        code:
          type: integer
        msg:
          type: string
        data:
          type: object
          properties:
            total:
              type: integer
            page:
              type: integer
            pageSize:
              type: integer
            list:
              type: array
              items:
                $ref: '#/components/schemas/MaterialTag'

    MaterialTag:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        color:
          type: integer
          enum: [0, 1, 2, 3, 4, 5]

    CreateTagRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 30
        color:
          type: integer
          enum: [0, 1, 2, 3, 4, 5]
          default: 0

    CreateTagResponse:
      type: object
      properties:
        traceId:
          type: string
        code:
          type: integer
        msg:
          type: string
        data:
          type: object
          properties:
            id:
              type: string

    SetMaterialTagRequest:
      type: object
      required:
        - materialIds
        - tagIds
      properties:
        materialIds:
          type: array
          items:
            type: string
        tagIds:
          type: array
          items:
            type: string

    # ==================== 分组管理 ====================
    GroupListResponse:
      type: object
      properties:
        traceId:
          type: string
        code:
          type: integer
        msg:
          type: string
        data:
          type: object
          properties:
            total:
              type: integer
            page:
              type: integer
            pageSize:
              type: integer
            list:
              type: array
              items:
                $ref: '#/components/schemas/GroupData'

    GroupData:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        remark:
          type: string
        createTime:
          type: integer

    CreateGroupRequest:
      type: object
      required:
        - list
      properties:
        list:
          type: array
          items:
            type: object
            required:
              - name
            properties:
              name:
                type: string
                maxLength: 50
              remark:
                type: string
                maxLength: 500

    CreateGroupResponse:
      type: object
      properties:
        traceId:
          type: string
        code:
          type: integer
        msg:
          type: string
        data:
          type: object
          properties:
            totalAmount:
              type: integer
            successAmount:
              type: integer
            failAmount:
