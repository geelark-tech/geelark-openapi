# ==================== Components ====================
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: API Token obtained from GeeLark client
    ApiKeyAuth:
      type: apiKey
      in: header
      name: appId
      description: Team AppId for signature verification

  schemas:
    # ==================== Common ====================
    ApiResponse:
      type: object
      properties:
        traceId:
          type: string
          description: Request trace ID
        code:
          type: integer
          description: Response code (0=success)
        msg:
          type: string
          description: Response message

    BatchOperationResponse:
      type: object
      properties:
        traceId:
          type: string
        code:
          type: integer
        msg:
          type: string
        data:
          type: object
          properties:
            totalAmount:
              type: integer
            successAmount:
              type: integer
            failAmount:
              type: integer
            successDetails:
              type: array
              items:
                type: object
            failDetails:
              type: array
              items:
                $ref: '#/components/schemas/FailDetail'

    FailDetail:
      type: object
      properties:
        code:
          type: integer
          description: Error code
        id:
          type: string
          description: Resource ID
        msg:
          type: string
          description: Error message

    TaskResponse:
      type: object
      properties:
        traceId:
          type: string
        code:
          type: integer
        msg:
          type: string
        data:
          type: object
          properties:
            taskId:
              type: string
              description: Task ID

    PaginationRequest:
      type: object
      properties:
        page:
          type: integer
          minimum: 1
          default: 1
          description: Page number
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
          description: Items per page

    PaginationResponse:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
        list:
          type: array
          items:
            type: object

    # ==================== Cloud Phone ====================
    CloudPhoneListRequest:
      allOf:
        - $ref: '#/components/schemas/PaginationRequest'
        - type: object
          properties:
            ids:
              type: array
              items:
                type: string
              description: Filter by cloud phone IDs
            serialName:
              type: string
              description: Filter by name
            groupName:
              type: string
              description: Filter by group name
            tags:
              type: array
              items:
                type: string
              description: Filter by tag names
            openStatus:
              type: integer
              enum: [0, 1]
              description: 0=off, 1=on

    CloudPhoneListResponse:
      type: object
      properties:
        traceId:
          type: string
        code:
          type: integer
        msg:
          type: string
        data:
          type: object
          properties:
            total:
              type: integer
            page:
              type: integer
            pageSize:
              type: integer
            items:
              type: array
              items:
                $ref: '#/components/schemas/CloudPhone'

    CloudPhone:
      type: object
      properties:
        id:
          type: string
        serialName:
          type: string
        serialNo:
          type: string
        status:
          type: integer
          enum: [0, 1, 2]
          description: 0=stopped, 1=starting, 2=running
        chargeMode:
          type: integer
