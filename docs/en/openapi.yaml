      operationId: setGps
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetGpsRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /phone/gps/get:
    post:
      tags: [Cloud Phone Settings]
      summary: Get GPS location
      description: Retrieve current GPS location of cloud phone
      operationId: getGps
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
              properties:
                id:
                  type: string
                  description: Cloud phone ID
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
