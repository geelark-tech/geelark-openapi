  /phone/network:
    post:
      tags: [Cloud Phone Settings]
      summary: Modify network settings
      description: Configure proxy and network settings
      operationId: modifyNetworkSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModifyNetworkRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /phone/network/get:
    post:
      tags: [Cloud Phone Settings]
      summary: Get network settings
      description: Retrieve current network configuration
