    # ==================== Error Codes ====================
    ErrorCode:
      type: object
      properties:
        code:
          type: integer
          description: Error code
        msg:
          type: string
          description: Error message

    GlobalErrorCodeEntry:
      type: object
      required: [code, description]
      properties:
        code:
          type: integer
        description:
          type: string

    GlobalErrorCodes:
      type: array
      description: Global error codes applicable to all APIs (reference only)
      items:
        $ref: '#/components/schemas/GlobalErrorCodeEntry'
      example:
        - code: 0
          description: Success
        - code: 40000
          description: Unknown error
        - code: 40001
          description: Failed to read request body
        - code: 40002
          description: traceId is empty
        - code: 40003
          description: Signature verification failed
        - code: 40004
          description: Parameter validation failed
        - code: 40005
          description: Resource not found
        - code: 40006
          description: Partial success for batch operation
        - code: 40007
          description: Request rate limited
        - code: 40008
          description: Pagination parameter error
        - code: 40009
          description: Batch operation failed completely
        - code: 40011
          description: Available to paid users only
        - code: 40012
          description: API is deprecated
        - code: 41001
          description: Insufficient balance
        - code: 47002
          description: Too many concurrent requests

security:
  - BearerAuth: []
