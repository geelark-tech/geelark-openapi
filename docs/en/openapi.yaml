    # ==================== Browser ====================
    CreateBrowserRequest:
      type: object
      required:
        - serialName
        - browserOs
      properties:
        serialName:
          type: string
          maxLength: 100
        groupId:
          type: string
        tagIds:
          type: array
          items:
            type: string
        remark:
          type: string
          maxLength: 1500
        cookie:
          type: string
        accountPlatform:
          type: string
          enum: [https://www.tiktok.com/, https://www.facebook.com/]
        accountUsername:
          type: string
        accountPassword:
          type: string
        accountTOTPSecret:
          type: string
        openLastPage:
          type: integer
          enum: [1, 2]
          default: 2
        openSpecPage:
          type: integer
          enum: [1, 2]
          default: 2
        openTabs:
          type: string
        browserOs:
          type: integer
          enum: [1, 2]
          description: 1=Windows, 2=macOS
        browserUa:
          type: string
        simulateConfig:
          $ref: '#/components/schemas/SimulateConfig'
        proxyId:
          type: string
        proxyConfig:
          $ref: '#/components/schemas/BrowserProxyConfig'
        browserStartArg:
          type: string

    SimulateConfig:
      type: object
      required:
        - timeZone
        - language
        - resolution
        - webRtc
        - geoLocation
        - canvas
        - webglImage
        - hardware
        - audioContext
        - mediaDevice
        - clientRects
        - speechVoise
        - hardwareConcurrency
        - memoryDevice
        - doNotTrack
        - bluetooth
        - battery
        - portScanProtection
      properties:
        timeZone:
          $ref: '#/components/schemas/SwitchConfig'
        language:
          $ref: '#/components/schemas/SwitchConfig'
        resolution:
          $ref: '#/components/schemas/SwitchConfig'
        webRtc:
          $ref: '#/components/schemas/SwitchConfig'
        geoLocation:
          $ref: '#/components/schemas/GeoLocationConfig'
        canvas:
          $ref: '#/components/schemas/SwitchConfig'
        webglImage:
          $ref: '#/components/schemas/SwitchConfig'
        hardware:
          $ref: '#/components/schemas/SwitchConfig'
        audioContext:
          $ref: '#/components/schemas/SwitchConfig'
        mediaDevice:
          $ref: '#/components/schemas/SwitchConfig'
        clientRects:
          $ref: '#/components/schemas/SwitchConfig'
        speechVoise:
          $ref: '#/components/schemas/SwitchConfig'
        hardwareConcurrency:
          type: integer
        memoryDevice:
          type: integer
        doNotTrack:
          type: integer
          enum: [0, 1, 2]
        bluetooth:
          $ref: '#/components/schemas/SwitchConfig'
        battery:
          $ref: '#/components/schemas/SwitchConfig'
        portScanProtection:
          $ref: '#/components/schemas/PortScanConfig'

    SwitchConfig:
      type: object
      required:
        - switcher
      properties:
        switcher:
          type: integer
        value:
          type: string

    GeoLocationConfig:
      type: object
      required:
        - switcher
      properties:
        switcher:
          type: integer
        baseOnIp:
          type: boolean
        longitude:
          type: number
        latitude:
          type: number
        accuracy:
          type: number

    PortScanConfig:
      type: object
      required:
        - switcher
      properties:
        switcher:
          type: integer
        value:
          type: string

    BrowserProxyConfig:
      type: object
      properties:
        typeId:
          type: integer
          enum: [-1, 1, 2, 3, 20, 21, 22, 23]
          description: "-1=direct, 1=socks5, 2=http, 3=https, 20=IPIDEA, 21=IPHTML, 22=kookeey, 23=Lumatuo"
        server:
          type: string
        port:
          type: integer
        username:
          type: string
        password:
          type: string
        country:
          type: string
        region:
          type: string
        city:
          type: string
        useProxyCfg:
          type: boolean
        protocol:
          type: integer
          enum: [1, 2]
          description: 1=socks5, 2=http

    CreateBrowserResponse:
      type: object
      properties:
