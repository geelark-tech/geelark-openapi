openapi: 3.0.3
info:
  title: GeeLark API
  description: |
    GeeLark provides Cloud Phone and Browser automation APIs for social media management.

    ## API Overview
    - **Cloud Phone API**: Control cloud phones, manage proxies, groups, tags, materials, and automate tasks
    - **Browser API**: Manage browser environments with fingerprint spoofing for web automation
    - **Billing API**: Manage subscription plans and billing

    ## Authentication
    - Token verification: `Authorization: Bearer <token>`
    - Key verification: `appId`, `traceId`, `ts`, `nonce`, `sign`

    ## Rate Limiting
    - 200 requests per minute
    - 24,000 requests per hour

    ## Response Format
    ```json
    {
      "traceId": "string",
      "code": 0,
      "msg": "success",
      "data": {}
    }
    ```
  version: "1.0"
  contact:
    name: GeeLark Support
    url: https://www.geelark.com

servers:
  - url: https://openapi.geelark.com/open/v1
    description: Cloud Phone API Server
  - url: http://localhost:40185/api/v1
    description: Browser API (requires local client)

tags:
  - name: Cloud Phone Management
    description: Cloud phone lifecycle management (create, start, stop, delete, clone)
  - name: Cloud Phone Settings
    description: Configure GPS, network, screen, ADB, etc.
  - name: Application Management
    description: Install, uninstall, start, stop applications
  - name: File Management
    description: Upload files to cloud phones and keybox management
  - name: Library
    description: Material center for managing images, videos, and tags
  - name: Automation
    description: Social media automation tasks (TikTok, Facebook, Instagram, etc.)
  - name: Task Management
    description: Query, cancel, retry automation tasks
  - name: Browser Management
    description: Browser environment management with fingerprint spoofing
  - name: Group Management
    description: Organize cloud phones and browsers into groups
  - name: Tag Management
    description: Tag cloud phones and browsers for categorization
  - name: Proxy Management
    description: Manage proxy configurations
  - name: Billing
    description: Subscription plans and billing operations
  - name: Webhook
    description: Webhook configuration for task callbacks
  - name: Analytics
    description: Account analytics data management

paths:
  # ==================== Cloud Phone Management ====================
  /phone/list:
    post:
      tags: [Cloud Phone Management]
      summary: Get all cloud phones
      description: Retrieve the list of cloud phones with filtering and pagination
      operationId: getAllCloudPhones
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloudPhoneListRequest'
            example:
              page: 1
              pageSize: 10
              openStatus: 1
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudPhoneListResponse'

  /phone/addNew:
    post:
      tags: [Cloud Phone Management]
      summary: Create new cloud phones
      description: |
        Create one or more cloud phones.
        - Basic plan: supports creating 1 cloud phone at a time
        - Pro plan: supports batch creation (up to 100)
      operationId: createCloudPhones
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCloudPhoneRequest'
            example:
              mobileType: "Android 12"
              chargeMode: 0
              data:
                - profileName: "myPhone"
                  proxyInformation: "socks5://user:pass@100.200.200.100:30000"
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCloudPhoneResponse'
      x-readme:
        samples:
          - language: python
            code: |
              import requests
              response = requests.post(
                'https://openapi.geelark.com/open/v1/phone/addNew',
                headers={'Authorization': 'Bearer YOUR_TOKEN'},
                json={
                  'mobileType': 'Android 12',
                  'data': [{'profileName': 'myPhone'}]
                }
              )

  /phone/start:
    post:
      tags: [Cloud Phone Management]
      summary: Start cloud phones
      description: Batch start cloud phones and return remote access URLs
      operationId: startCloudPhones
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartCloudPhoneRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartCloudPhoneResponse'

  /phone/stop:
    post:
      tags: [Cloud Phone Management]
      summary: Stop cloud phones
      description: Batch stop running cloud phones
      operationId: stopCloudPhones
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StopCloudPhoneRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchOperationResponse'

  /phone/delete:
    post:
      tags: [Cloud Phone Management]
      summary: Delete cloud phones
      description: Delete cloud phones by IDs
      operationId: deleteCloudPhones
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteCloudPhoneRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchOperationResponse'

  /phone/clone:
    post:
      tags: [Cloud Phone Management]
      summary: Clone cloud phone
      description: Clone an existing cloud phone configuration
      operationId: cloneCloudPhone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloneCloudPhoneRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloneCloudPhoneResponse'

  /phone/status:
    post:
      tags: [Cloud Phone Management]
      summary: Query cloud phone status
      description: Get current status of cloud phones
      operationId: queryCloudPhoneStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - ids
              properties:
                ids:
                  type: array
                  items:
                    type: string
                  description: Cloud phone IDs
                  maxItems: 200
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryStatusResponse'

  /phone/screenshot:
