        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppListResponse'

  /phone/app/start:
    post:
      tags: [Application Management]
      summary: Start application
      description: Launch an application on cloud phone
      operationId: startApp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppOperationRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /phone/app/stop:
    post:
      tags: [Application Management]
      summary: Stop application
      description: Force stop an application
      operationId: stopApp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppOperationRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /phone/app/install:
    post:
      tags: [Application Management]
      summary: Install application
      description: Install application from uploaded APK or Google Play
      operationId: installApp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstallAppRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /phone/app/uninstall:
